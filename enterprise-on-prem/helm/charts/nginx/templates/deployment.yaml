apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      release: {{ .Release.Name }}
  replicas: 1
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
        heritage: {{ .Release.Service }}
        release: {{ .Release.Name }}
      annotations:
        # Roll the pods when the routing configuration changes. Without this the
        # ConfigMap is updated but the running nginx keeps its old config, because
        # the file is mounted with subPath and so is not refreshed in place.
        checksum/config: {{ tpl .Values.serverBlock . | sha256sum }}
    spec:
      containers:
        - name: {{ .Release.Name }}-{{ .Chart.Name }}
          image: "{{ tpl .Values.image . }}"
          imagePullPolicy: {{ tpl .Values.imagePullPolicy . }}
          ports:
            - name: http
              containerPort: {{ required "required" .Values.containerPort }}
          volumeMounts:
            - name: server-block
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          # A TCP check rather than an HTTP one: the proxied services may legitimately
          # answer / with a non-2xx status (the Object Service returns 403 to
          # unauthenticated requests), which would fail an httpGet probe even though
          # nginx itself is healthy.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: server-block
          configMap:
            name: {{ .Release.Name }}-{{ .Chart.Name }}
