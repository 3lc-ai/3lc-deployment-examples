apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
  - name: http-server
    port: {{ required "required" .Values.servicePort }}
    targetPort: {{ required "required" .Values.servicePort }}
  selector:
    app: {{ .Chart.Name }}
    release: {{ .Release.Name }}
