apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      release: {{ .Release.Name }}
  replicas: 1
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
        heritage: {{ .Release.Service }}
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Release.Name }}-{{ .Chart.Name }}
          image: "{{- tpl .Values.image . }}"
          imagePullPolicy: {{ tpl .Values.imagePullPolicy . }}
          volumeMounts:
            - name: 3lc-root
              mountPath: /data
            # Everything the Compute Service remembers lives in ~/.3lc-compute: settings.json,
            # which records the installed plugins, and the per-plugin virtual environments
            # under managed-plugins/. Without this it is all lost whenever the pod restarts,
            # so installed plugins silently disappear. subPath keeps it on the same volume as
            # the project data, which lands it on the same host directory Compose uses.
            # The path is mounted directly because the settings file location is not configurable.
            - name: 3lc-root
              mountPath: /root/.3lc-compute
              subPath: 3lc-compute
          ports:
            - name: http-server
              containerPort: {{ required "compute-service: servicePort is required" .Values.servicePort }}
          livenessProbe:
            httpGet:
              # The Compute Service exposes /health, which reports its status and version
              path: /health
              port: http-server
            initialDelaySeconds: 60
            timeoutSeconds: 20
            failureThreshold: 6
          env:
            # TLC_LICENSE is required for 3LC to run when deployed in enterprise settings. This should be the value of the license key provided from 3LC.
            # This can also be configured as a Kubernetes secret for more security. For the sake of the demo, a Kubernetes secret is not used.
            - name: TLC_LICENSE
              value: {{ tpl .Values.licenseKey . | required "global.licenseKey is required. Pass it with --set-string global.licenseKey=$TLC_LICENSE, or set it in your values file." | quote }}
            # TLC_OBJECT_SERVICE_AUTH_SECRET is required alongside the license key in enterprise settings.
            # This should be the same strong, random string used by the other services.
            - name: TLC_OBJECT_SERVICE_AUTH_SECRET
              value: {{ tpl .Values.objectServiceAuthSecret . | required "global.objectServiceAuthSecret is required. Pass it with --set-string global.objectServiceAuthSecret=$TLC_OBJECT_SERVICE_AUTH_SECRET, or set it in your values file." | quote }}
            # TLC_PROJECT_ROOT_URL can be configured to provide the location where 3LC projects are stored.
            # The Compute Service uses the tlc SDK directly, so it is pointed at the same projects as the Object Service.
            - name: TLC_PROJECT_ROOT_URL
              value: "/data/3lc/project"
            # Keep uv's wheel cache alongside the plugin venvs, on the same volume, so it
            # survives too and uv can hardlink from it instead of downloading again.
            - name: UV_CACHE_DIR
              value: "/root/.3lc-compute/uv-cache"
      volumes:
        - name: 3lc-root
          hostPath:
            path: {{ tpl .Values.pvc_host_path . }}
            type: DirectoryOrCreate
