# Every subchart is vendored under charts/, so nothing is fetched and
# `helm dependency build` is not needed. These entries exist because Helm
# requires each subchart present in charts/ to be declared; without them
# `helm lint` fails with "chart metadata is missing these dependencies".
#
# The versions are left open. A pinned version here would have to be kept in
# step with each subchart's own Chart.yaml for no benefit, since the local
# chart is used whatever the constraint says.
dependencies:
  - name: object-service
    version: "*"
    repository: file://charts/object-service
  - name: compute-service
    version: "*"
    repository: file://charts/compute-service
  - name: dashboard
    version: "*"
    repository: file://charts/dashboard
  - name: hub-frontend
    version: "*"
    repository: file://charts/hub-frontend
  - name: nginx
    version: "*"
    repository: file://charts/nginx
