# This file demonstrates deploying the helm chart to Kubernetes in Docker Desktop.
#
# It is a values overlay for the LOCAL cluster case only. It assumes `docker compose build`
# has already been run, so the images exist in the local Docker daemon (see README Part 2).
# For a real cluster, write your own overlay instead of editing this one.

object-service:
  imagePullPolicy: Never # On Docker Desktop, we already built the image, so we don't want to pull.

compute-service:
  imagePullPolicy: Never # On Docker Desktop, we already built the image, so we don't want to pull.

dashboard:
  imagePullPolicy: Never # On Docker Desktop, we already built the image, so we don't want to pull.

hub-frontend:
  imagePullPolicy: Never # On Docker Desktop, we already built the image, so we don't want to pull.

# Force nginx to use the exact port for its nodeport so that we have a predictable URL (for the dnsName field below) for the Object Service.
nginx:
  service:
    nodePorts: 
      http: 30000

global:
  # For localhost, there is no containerRegistry
  containerRegistry: #

  # This is the image tag built from the docker-compose
  imageTag: latest #

  # Used to build the Object Service URL for the Dashboard so that it knows to connect to the Object Service in this domain.
  # This URL is resolved by the BROWSER, so it must be an address reachable from there.
  # Matches the nginx nodePort above.
  dnsName: localhost:30000

  # Intentionally left blank and these must be filled out before running this sample.
  # Note that Kubernetes does not read .env — these must be supplied here as well.
  # The PyPI keys are NOT needed here: they are build-time only (see README Part 2).
  licenseKey: #
  objectServiceAuthSecret: #

  # This is to demonstrate the ability to use volume mounts.
  # Absolute path to this folder's `mounts` directory, in Docker Desktop's host-mount form:
  # a Windows path C:\some\path\mounts becomes /run/desktop/mnt/host/c/some/path/mounts.
  # The value below is an EXAMPLE and will not match your checkout — update it.
  pvc_host_path: /run/desktop/mnt/host/c/sources/tlc/3lc-deployment-examples/enterprise-on-prem/mounts