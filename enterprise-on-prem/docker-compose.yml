# The private PyPI credentials are passed to the builds as build secrets rather than
# build args, so they never reach the image's layer metadata. `environment:` reads them
# from .env, the same place everything else here comes from.
secrets:
  tlc_pypi_access_key:
    environment: TLC_PYPI_ACCESS_KEY
  tlc_pypi_secret_key:
    environment: TLC_PYPI_SECRET_KEY

services:
  proxy:
    image: nginx:alpine
    volumes:
      - "./default.conf:/etc/nginx/conf.d/default.conf"
    ports:
      - 8080:80
    command: /bin/sh -c "nginx -g 'daemon off;'"
    restart: always
    depends_on:
      - object_service
      - compute_service
      - dashboard
      - hub_frontend

  object_service:
    image: "tlc-enterprise-object-service:latest"
    build:
      dockerfile: object_service.Dockerfile
      secrets:
        - tlc_pypi_access_key
        - tlc_pypi_secret_key
      args:
        - TLC_VERSION=3.1.0
    environment:
      - TLC_LICENSE=${TLC_LICENSE}
      - TLC_OBJECT_SERVICE_AUTH_SECRET=${TLC_OBJECT_SERVICE_AUTH_SECRET}
      - TLC_PROJECT_ROOT_URL=/data/3lc/project
    volumes:
      - ./mounts/3lc:/data/3lc
    ports:
      - 5001:5015

  compute_service:
    image: "tlc-enterprise-compute-service:latest"
    build:
      dockerfile: compute_service.Dockerfile
      args:
        - TLC_COMPUTE_VERSION=0.2.1
    environment:
      - TLC_LICENSE=${TLC_LICENSE}
      - TLC_OBJECT_SERVICE_AUTH_SECRET=${TLC_OBJECT_SERVICE_AUTH_SECRET}
      - TLC_PROJECT_ROOT_URL=/data/3lc/project
      # Keep uv's wheel cache alongside the plugin venvs, on the same mount, so it
      # survives too and uv can reuse downloads instead of fetching them again.
      - UV_CACHE_DIR=/root/.3lc-compute/uv-cache
    volumes:
      - ./mounts/3lc:/data/3lc
      # Everything the Compute Service remembers lives in ~/.3lc-compute: settings.json,
      # which records the installed plugins, and the per-plugin virtual environments under
      # managed-plugins/. Without this mount both are lost whenever the container is
      # recreated, so installed plugins silently disappear. The path is mounted directly
      # because the settings file location is not configurable.
      - ./mounts/3lc-compute:/root/.3lc-compute
    ports:
      - 5002:5020

  dashboard:
    image: "tlc-enterprise-dashboard:latest"
    build:
      dockerfile: dashboard.Dockerfile
      secrets:
        - tlc_pypi_access_key
        - tlc_pypi_secret_key
      args:
        - DASHBOARD_VERSION=2.8.4
    environment:
      - TLC_OBJECT_SERVICE_AUTH_SECRET=${TLC_OBJECT_SERVICE_AUTH_SECRET}
    # Override the location of the Object Service with the expected full DNS address
    command: ["--object-service", "http://localhost:8080/object-service"]
    ports:
      - 5003:8080

  hub_frontend:
    image: "tlc-enterprise-hub-frontend:latest"
    build:
      dockerfile: hub_frontend.Dockerfile
      secrets:
        - tlc_pypi_access_key
        - tlc_pypi_secret_key
      args:
        - TLC_HUB_FRONTEND_VERSION=0.1.3
    environment:
      - TLC_OBJECT_SERVICE_AUTH_SECRET=${TLC_OBJECT_SERVICE_AUTH_SECRET}
      # These three are resolved by the BROWSER, not by this container, so they are proxy
      # addresses rather than container names.
      - TLC_OBJECT_SERVICE_URL=http://localhost:8080/object-service
      - TLC_COMPUTE_SERVICE_URL=http://localhost:8080/compute
      - TLC_DASHBOARD_URL=http://localhost:8080/dashboard
    ports:
      - 5004:8081


