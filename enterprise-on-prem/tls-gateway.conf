# TLS at a single entry point.
#
# One hostname fronts every component, exactly as default.conf does over plain
# HTTP, with TLS terminated here. The 3LC services cannot terminate TLS
# themselves, so the hop from this proxy to each service stays plain HTTP on the
# internal network. That is invisible to the browser, which sees https
# throughout, and is the same arrangement an Ingress or load balancer uses.

upstream object_service {
    server object_service:5015;
}

upstream compute_service {
    server compute_service:5020;
}

upstream dashboard {
    server dashboard:8080;
}

upstream hub_frontend {
    server hub_frontend:8081;
}

# Anything arriving over plain HTTP is sent to the HTTPS site.
server {
    listen 80;
    server_name 3lc.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name 3lc.localhost;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Tell the services their caller arrived over https, so any URL they build
    # for the browser uses the right scheme.
    proxy_set_header X-Forwarded-Proto https;

    # Pass everything after /object-service as is to the root of the Object Service.
    location /object-service/ {
        proxy_pass http://object_service/;
        proxy_redirect     off;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host $server_name;
    }

    # Pass everything after /compute as is to the root of the Compute Service.
    location /compute/ {
        proxy_pass http://compute_service/;
        proxy_redirect     off;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host $server_name;
    }

    # The Dashboard is served under a path prefix. Its assets are relative and webpack
    # resolves chunks from the script URL, so it tolerates that.
    location /dashboard/ {
        proxy_pass http://dashboard/;
        proxy_redirect     off;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host $server_name;
    }

    # The two directories the Dashboard references by absolute path, which therefore do not
    # pick up the /dashboard/ prefix: index.html hardcodes /icons/3lc_top_left.png for the
    # favicon, and /workflow_images/ is its other asset directory. These are the only two
    # directories in the Dashboard's web root; check that still holds when upgrading it.
    location /icons/ {
        proxy_pass http://dashboard/icons/;
        proxy_redirect     off;
        proxy_set_header   Host $host;
    }

    location /workflow_images/ {
        proxy_pass http://dashboard/workflow_images/;
        proxy_redirect     off;
        proxy_set_header   Host $host;
    }

    # The Hub is the primary entry point and owns the root of the URL space. It cannot be
    # served under a path prefix: the wheel passes no url_prefix to waitress, exposes no
    # flag to set one, and its templates emit hardcoded absolute links such as /projects.
    location / {
        proxy_pass http://hub_frontend;
        proxy_redirect     off;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host $server_name;
    }
}
