apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
data:
  # Mounted as /etc/nginx/conf.d/default.conf, replacing the stock server block
  # that ships in the nginx image. This is the Kubernetes counterpart to the
  # default.conf that docker-compose.yml mounts into the proxy container.
  #
  # Rendered with tpl so the parent chart's serverBlock can refer to the other
  # services as {{ "{{ .Release.Name }}" }}-object-service and similar.
  default.conf: |-
{{ tpl (required "nginx.serverBlock must be set by the parent chart" .Values.serverBlock) . | indent 4 }}
