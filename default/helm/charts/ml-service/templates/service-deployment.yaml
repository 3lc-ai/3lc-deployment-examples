apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      release: {{ .Release.Name }}
  replicas: 1
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
        heritage: {{ .Release.Service }}
        release: {{ .Release.Name }}
    spec:
      containers:
      - name: {{ .Release.Name }}-{{ .Chart.Name }}
        image: "{{- tpl .Values.image . }}"
        volumeMounts:
          - name: my-volume
            mountPath: /data
          - name: my-volume
            subPath: jupyter
            mountPath: /home/jovyan/work
        imagePullPolicy: {{ tpl .Values.imagePullPolicy . }}
        ports:
        - name: http-server
          containerPort: {{ required "required" .Values.servicePort }}
        command: ["start-notebook.sh", "--NotebookApp.base_url=/lab", "--NotebookApp.token=''"]
        livenessProbe:
          httpGet:
            path: /lab
            port: http-server
          initialDelaySeconds: 60
          timeoutSeconds: 20
          failureThreshold: 6
        env:
          # TLC_API_KEY is required for 3LC to run. This should be the value of the 3LC account API key.
          # This can also be configured as a Kubernetes secret for more security.
          # For the sake of the demo, a Kubernetes secret is not used.
          - name: TLC_API_KEY
            value: "{{ tpl .Values.apiKey . }}"
          # TLC_CONFIG_PROJECT_ROOT_URL can be configured to provide the location where 3LC projects are stored.
          # For this demo, the volume is mounted as /data from the host file system (./mounts/3lc) so that we can see the projects being saved to the current folder.
          # This field should also be mapped the same way in the Object Service so that projects saved by the ML process can be accessed by the Object Service.
          - name: TLC_CONFIG_PROJECT_ROOT_URL
            value: "/data/3lc/project"
      volumes:
        - name: my-volume
          hostPath:
            path: {{ tpl .Values.pvc_host_path . }}
            type: DirectoryOrCreate
        
          
