object-service:
  # tlc-default-object-service is the name used in docker-compose when building the docker image. Change according to the desired name in container registry.
  image: "{{ .Values.global.containerRegistry }}tlc-default-object-service:{{ .Values.global.imageTag }}"
  apiKey: "{{ .Values.global.apiKey }}"
  pvc_host_path: "{{ .Values.global.pvc_host_path }}"

compute-service:
  # tlc-default-compute-service is the name used in docker-compose when building the docker image. Change according to the desired name in container registry.
  image: "{{ .Values.global.containerRegistry }}tlc-default-compute-service:{{ .Values.global.imageTag }}"
  apiKey: "{{ .Values.global.apiKey }}"
  pvc_host_path: "{{ .Values.global.pvc_host_path }}"

nginx:
  service:
    type: NodePort

  # Everything after / is passed to the Object Service by default, e.g. /api/live -> object-service:5015/live.
  # Thus, the trailing slash in both the location and proxy_pass is important.
  serverBlock: |-
    # When nginx adds a missing trailing slash it redirects to a URL it builds itself,
    # using the port it listens on rather than the one the caller used. Behind a
    # published port or a NodePort those differ, so /object-service would send a browser
    # to a port nothing serves. Relative redirects leave the host and port alone.
    absolute_redirect off;

    server {
      listen 0.0.0.0:8080;
      location / {
        proxy_pass http://{{ .Release.Name }}-object-service:5015/;
        proxy_redirect     off;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      }
      location /compute/ {
        proxy_pass http://{{ .Release.Name }}-compute-service:5020/;
        proxy_redirect     off;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      }
    }



# Global configuration
global:
  # Docker registry URI
  containerRegistry: #

  # Image tag to use to pull from registry
  imageTag: #

  # Service DNS name, like "tlc.mydomain.com"
  dnsName: #

  # The 3LC account API key
  apiKey: #

  # Where the 3LC projects are on the host machine
  pvc_host_path: #


