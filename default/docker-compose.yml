services:
  proxy:
    image: nginx:alpine
    volumes:
      - "./default.conf:/etc/nginx/conf.d/default.conf"
    ports:
      - 8080:80
    command: /bin/sh -c "nginx -g 'daemon off;'"
    restart: always
    depends_on:
      - object_service
      - compute_service

  object_service:
    image: "tlc-default-object-service:latest"
    build:
      dockerfile: object_service.Dockerfile
      args:
        - TLC_VERSION=3.1.0
    environment:
      - TLC_API_KEY=${TLC_API_KEY}
      - TLC_PROJECT_ROOT_URL=/data/3lc/project
    volumes:
      - ./mounts/3lc:/data/3lc
    ports:
      - 5001:5015

  compute_service:
    image: "tlc-default-compute-service:latest"
    build:
      dockerfile: compute_service.Dockerfile
      args:
        - TLC_COMPUTE_VERSION=0.2.1
    environment:
      - TLC_API_KEY=${TLC_API_KEY}
      - TLC_PROJECT_ROOT_URL=/data/3lc/project
      # Keep uv's wheel cache alongside the plugin venvs, on the same mount, so it
      # survives too and uv can reuse downloads instead of fetching them again.
      - UV_CACHE_DIR=/root/.3lc-compute/uv-cache
    volumes:
      - ./mounts/3lc:/data/3lc
      # Everything the Compute Service remembers lives in ~/.3lc-compute: settings.json,
      # which records the installed plugins, and the per-plugin virtual environments under
      # managed-plugins/. Without this mount both are lost whenever the container is
      # recreated, so installed plugins silently disappear. The path is mounted directly
      # because the settings file location is not configurable.
      - ./mounts/3lc-compute:/root/.3lc-compute
    ports:
      - 5002:5020


