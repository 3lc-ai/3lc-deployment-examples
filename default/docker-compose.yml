services:
  proxy:
    image: nginx:alpine
    volumes:
      - "./default.conf:/etc/nginx/conf.d/default.conf"
    ports:
      - 8080:80
    expose:
      - "8080"
    command: /bin/sh -c "nginx -g 'daemon off;'"
    restart: always
    depends_on:
      - object_service
      - compute_service

  object_service:
    image: "tlc-default-object-service:latest"
    build:
      dockerfile: object_service.Dockerfile
      args:
        - TLC_VERSION=3.1.0
    environment:
      - TLC_API_KEY=${TLC_API_KEY}
      - TLC_PROJECT_ROOT_URL=/data/3lc/project
    volumes:
      - ./mounts/3lc:/data/3lc
    ports:
      - 5002:5015
    expose:
      - "5002"

  compute_service:
    image: "tlc-default-compute-service:latest"
    build:
      dockerfile: compute_service.Dockerfile
      args:
        - TLC_COMPUTE_VERSION=0.2.1
    environment:
      - TLC_API_KEY=${TLC_API_KEY}
      - TLC_PROJECT_ROOT_URL=/data/3lc/project
    volumes:
      - ./mounts/3lc:/data/3lc
    ports:
      - 5003:5020
    expose:
      - "5020"

  # Using docker-host image to access host network from inside of portal container
  dockerhost:
    image: qoomon/docker-host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 16M

