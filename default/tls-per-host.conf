# TLS with one hostname per component.
#
# Each component gets its own origin, so nothing is served under a path prefix
# and nginx routes purely on the requested hostname. This is how the components
# are laid out in a real deployment, and it is what lets any one of them live
# somewhere else: the browser is told where each service is, so moving one to
# another host or cluster is a change of URL and nothing more.
#
# The 3LC services cannot terminate TLS themselves, so it ends here and the hop
# to each service stays plain HTTP on the internal network. Swap this proxy for
# an Ingress, a gateway, or a corporate load balancer and only the holder of the
# certificate changes.
#
# The Hub and Dashboard you use are hosted by 3LC and call these services from
# your browser, so every request is cross-origin. Both APIs answer with
# access-control-allow-origin, so that works without extra configuration here.

upstream object_service {
    server object_service:5015;
}

upstream compute_service {
    server compute_service:5020;
}

# Common TLS settings, so each server block below stays short.
# One certificate covers every hostname through its subject alternative names.
ssl_certificate     /etc/nginx/certs/tls.crt;
ssl_certificate_key /etc/nginx/certs/tls.key;
ssl_protocols       TLSv1.2 TLSv1.3;

# When nginx adds a missing trailing slash it redirects to a URL it builds itself,
# using the port it listens on rather than the one the caller used. Behind a
# published port or a NodePort those differ, so /object-service would send a browser
# to a port nothing serves. Relative redirects leave the host and port alone.
absolute_redirect off;

# Plain HTTP is sent to the HTTPS site of the same name. Two things matter here.
# Only the names this deployment serves are redirected: anything else, plain
# localhost included, is not part of this topology and gets a 404 rather than a
# redirect to somewhere it is not served. And the redirect is temporary, because
# a browser remembers a permanent one and would keep following it long after the
# deployment is switched back to plain HTTP.
server {
    listen 80;
    server_name object-service.localhost compute.localhost;
    return 302 https://$host$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    return 404;
}

server {
    listen 443 ssl;
    http2 on;
    server_name object-service.localhost;

    proxy_set_header X-Forwarded-Proto https;

    location / {
        proxy_pass http://object_service;
        proxy_redirect     off;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name compute.localhost;

    proxy_set_header X-Forwarded-Proto https;

    location / {
        proxy_pass http://compute_service;
        proxy_redirect     off;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
