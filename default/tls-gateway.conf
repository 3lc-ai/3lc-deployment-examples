# TLS at a single entry point.
#
# Same routing as default.conf, with TLS terminated here. The 3LC services
# cannot terminate TLS themselves, so the hop from this proxy to each service
# stays plain HTTP on the internal network. The browser sees https throughout.
#
# This matters more on this surface than it might appear: the Hub and Dashboard
# you use are hosted by 3LC over https, and a browser will not let an https page
# call a plain-HTTP service. That works today only because http://localhost is
# treated as a trustworthy origin. Serve these services from anywhere other than
# localhost and they must be https, which is what this file is for.

upstream object_service {
    server object_service:5015;
}

upstream compute_service {
    server compute_service:5020;
}

# When nginx adds a missing trailing slash it redirects to a URL it builds itself,
# using the port it listens on rather than the one the caller used. Behind a
# published port or a NodePort those differ, so /object-service would send a browser
# to a port nothing serves. Relative redirects leave the host and port alone.
absolute_redirect off;

# Plain HTTP is sent to the HTTPS site of the same name. Two things matter here.
# Only the names this deployment serves are redirected: anything else, plain
# localhost included, is not part of this topology and gets a 404 rather than a
# redirect to somewhere it is not served. And the redirect is temporary, because
# a browser remembers a permanent one and would keep following it long after the
# deployment is switched back to plain HTTP.
server {
    listen 80;
    server_name 3lc.localhost;
    return 302 https://$host$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    return 404;
}

server {
    listen 443 ssl;
    http2 on;
    server_name 3lc.localhost;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    proxy_set_header X-Forwarded-Proto https;

    location / {
        proxy_pass http://object_service;
        proxy_redirect     off;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host $server_name;
    }

    # Pass everything after /compute as is to the root of the Compute Service.
    location /compute/ {
        proxy_pass http://compute_service/;
        proxy_redirect     off;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host $server_name;
    }
}
