[pytest]
junit_family = xunit2
addopts = --durations=0 --durations-min=5.0 -ra
log_cli_format = %(message)s

# Bringing a stack up involves image builds and service start-up. The per-test
# timeout is generous so a genuinely stuck stack fails rather than hangs.
timeout = 900

markers =
    compose: runs a Docker Compose deployment (slow; requires Docker)
    kubernetes: runs a Helm release on Docker Desktop (slowest; requires helm and a Kubeadm cluster)
    http: the plain-HTTP deployment
    tls: an HTTPS deployment (generates certificates, binds port 443)

testpaths =
    tests
